name: build
on:
  workflow_dispatch:
env:
  SIDESTORE_REF: develop
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          path: patcher
      - uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: ${{ env.SIDESTORE_REF }}
          submodules: recursive
          fetch-depth: 0
          path: ss
      - run: brew install ldid xcbeautify
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"
      - name: HealthKit-Patch anwenden
        working-directory: ss
        run: |
          python3 ../patcher/patch_healthkit.py
          git -C Dependencies/SideSign diff
      - name: Bauen
        working-directory: ss
        run: python3 scripts/ci/workflow.py build
      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-healthkit
          path: ss/SideStore.ipa
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="healthkit-${SIDESTORE_REF}-$(git -C ss rev-parse --short HEAD)-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" ss/SideStore.ipa --repo "$GITHUB_REPOSITORY" --title "SideStore $SIDESTORE_REF mit HealthKit" --notes "Offizielles SideStore ($SIDESTORE_REF, Stand $(git -C ss rev-parse --short HEAD)), nur mit dem HealthKit-Patch aus patch_healthkit.py."

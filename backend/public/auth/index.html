<h1 id="title">Anmelden mit Google</h1>
<p id="msg">Einen Moment …</p>
<a class="btn" id="back" href="#" hidden>Zurück zu Purrtion</a>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// Opened by the Purrtion app: /auth/?k=<API key>&p=<project>&s=<state>. Signs in with Google through Firebase and hands the
// Google ID token back to the app (purrtion://auth). The token is only valid for this project.
// Google only accepts the sign-in return address of the firebaseapp.com domain, which serves this same site.
if (/\.web\.app$/.test(location.host) && location.search) {
  location.replace('https://' + location.host.replace(/\.web\.app$/, '.firebaseapp.com') + location.pathname + location.search);
}
var q = new URLSearchParams(location.search);
var msg = document.getElementById('msg');
function fail(text) { msg.textContent = text; }
function back(params) {
  var url = 'purrtion://auth?' + new URLSearchParams(params).toString();
  var b = document.getElementById('back'); b.href = url; b.hidden = false;
  msg.textContent = 'Fertig. Du wirst zurück zu Purrtion geleitet.';
  location.href = url;
}
var state = (q.get('s') || '').slice(0, 64);
// The state survives the round trip to Google in the session.
if (q.get('k') && q.get('p')) {
  sessionStorage.setItem('purrtion.auth', JSON.stringify({ k: q.get('k'), p: q.get('p'), s: state }));
}
var saved = {};
try { saved = JSON.parse(sessionStorage.getItem('purrtion.auth') || '{}'); } catch (e) {}
if (!saved.k || !saved.p) {
  fail('Dieser Link funktioniert nur aus der Purrtion-App.');
} else {
  firebase.initializeApp({ apiKey: saved.k, projectId: saved.p, authDomain: location.host });
  var auth = firebase.auth();
  auth.getRedirectResult().then(function (res) {
    if (res && res.credential && res.credential.idToken) {
      var s = saved.s; sessionStorage.removeItem('purrtion.auth');
      return back({ id: res.credential.idToken, s: s });
    }
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    return auth.signInWithRedirect(provider);
  }).catch(function (e) {
    var s = saved.s; sessionStorage.removeItem('purrtion.auth');
    fail('Anmeldung fehlgeschlagen (' + (e.code || e.message) + ').');
    back({ error: e.code || 'error', s: s });
  });
}
</script></body></html>

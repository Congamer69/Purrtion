<h1 id="title">Freundschaftsanfrage</h1>
<p>Vergleicht euch in Purrtion: Serien, Zieltreue, Health Score und mehr.</p>
<a class="btn" id="open" href="#">In Purrtion öffnen</a>
<p>Oder in Purrtion unter <b>Freunde → Code eingeben</b>:</p>
<div class="code" id="code">––––––––</div>
<small>Noch kein Purrtion? Die App gibt es kostenlos auf <a href="https://github.com/Congamer69/Purrtion" style="color:var(--accent)">GitHub</a>.</small>
</div>
<script>
var code=(location.pathname.split('/f/')[1]||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,8);
var name=(new URLSearchParams(location.search).get('n')||'').slice(0,30);
document.getElementById('code').textContent=code||'––––––––';
if(name){document.getElementById('title').textContent=name+' möchte mit dir vergleichen';}
var url='purrtion://friend/'+code+(name?'?n='+encodeURIComponent(name):'');
document.getElementById('open').href=url;
if(code){setTimeout(function(){location.href=url;},400);}

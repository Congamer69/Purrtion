<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purrtion</title>
<style>
:root{--bg:#FFF8F1;--card:#fff;--text:#2B2230;--muted:#7A7085;--accent:#FF8A4A}
